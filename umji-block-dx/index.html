function cell(x,y,col,alpha=1){ctx.globalAlpha=alpha;ctx.fillStyle=col;ctx.fillRect(x*CELL+1,y*CELL+1,CELL-2,CELL-2);ctx.fillStyle="#ffffff40";ctx.fillRect(x*CELL+3,y*CELL+3,CELL-6,5);ctx.globalAlpha=1}
function draw(){ctx.clearRect(0,0,300,600);for(let y=0;y<ROW;y++)for(let x=0;x<COL;x++){ctx.strokeStyle="#c8e7f41a";ctx.strokeRect(x*CELL+.5,y*CELL+.5,CELL,CELL);if(grid[y]&&grid[y][x])cell(x,y,colors[grid[y][x]])}if(piece&&playing){let d=0;while(!occupied(piece,0,d+1))d++;for(let y=0;y<piece.matrix.length;y++)for(let x=0;x<piece.matrix[y].length;x++)if(piece.matrix[y][x]){if(piece.y+y+d>=0)cell(piece.x+x,piece.y+y+d,colors[piece.type],.16);if(piece.y+y>=0)cell(piece.x+x,piece.y+y,colors[piece.type])}}}
function loop(t){if(!playing||paused)return;let dt=Math.min(50,t-last);last=t;acc+=dt;let speed=Math.max(85,720*Math.pow(.81,level-1));if(acc>speed){acc=0;if(!occupied(piece,0,1))piece.y++;else lock()}draw();raf=requestAnimationFrame(loop)}
function begin(){cancelAnimationFrame(raf);clearTimeout(timer);$("board").classList.remove("happy","super");grid=empty();bag=[];piece=null;next=randomType();held=null;score=0;lines=0;level=1;snacks=0;combo=0;acc=0;playing=true;paused=false;spawn();hud();$("overlay").classList.add("hidden");$("reward").textContent="엄지가 첫 간식을 기다리고 있어! 🐶";last=performance.now();raf=requestAnimationFrame(loop)}
function gameover(){playing=false;cancelAnimationFrame(raf);$("modalTitle").textContent="엄지와 즐거운 시간이었어! 💛";$("modalMessage").innerHTML="획득 점수 "+score.toLocaleString()+"점<br>엄지가 받은 간식 "+snacks+"개<br>또 도전할까?";$("start").textContent="다시 시작 ▶";$("overlay").classList.remove("hidden")}
function pause(){if(!playing)return;paused=!paused;$("pause").textContent=paused?"▶ 계속":"Ⅱ 일시정지";if(!paused){last=performance.now();raf=requestAnimationFrame(loop)}else cancelAnimationFrame(raf)}
$("start").onclick=begin;$("pause").onclick=pause;$("rot").onclick=rotate;$("hard").onclick=hardDrop;$("hold").onclick=hold;
function holdButton(id,fn){const b=$(id);let interval=null;b.addEventListener("pointerdown",e=>{e.preventDefault();b.setPointerCapture(e.pointerId);fn();interval=setInterval(fn,110)});for(const event of ["pointerup","pointercancel","lostpointercapture"])b.addEventListener(event,()=>{clearInterval(interval);interval=null})}
holdButton("left",()=>move(-1));holdButton("right",()=>move(1));holdButton("drop",descend);
document.addEventListener("keydown",e=>{if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space","KeyC","KeyP"].includes(e.code))e.preventDefault();if(e.repeat&&["ArrowUp","Space","KeyC"].includes(e.code))return;switch(e.code){case"ArrowLeft":move(-1);break;case"ArrowRight":move(1);break;case"ArrowUp":rotate();break;case"ArrowDown":descend();break;case"Space":hardDrop();break;case"KeyC":hold();break;case"KeyP":pause()}});grid=empty();draw();
</script></body></html>
