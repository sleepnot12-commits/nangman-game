<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#142337"><title>엄지의 간식 블록 DX</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#111c2d;color:#f8e6c6;font-family:system-ui,-apple-system,sans-serif}body{overflow-x:hidden}.game{max-width:560px;margin:0 auto;padding:8px 10px 22px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.top h1{font-size:18px;margin:2px 0 4px;letter-spacing:-.7px}.top span{font-size:10px;color:#d1c5ac}.chip{font-size:12px;background:#2f4054;color:#ffe7b6;border-radius:15px;padding:7px;font-weight:700}.scores{display:flex;gap:6px;margin:5px 0}.scores>div{flex:1;text-align:center;background:#243448;border:1px solid #40516b;border-radius:9px;padding:4px}.scores small{display:block;font-size:10px;color:#b7c1cc}.scores b{font-size:17px;color:#ffdd9a}.meta{display:flex;align-items:center;justify-content:center;gap:7px;margin:6px 0}.mini{height:43px;min-width:67px;background:#243448;border-radius:8px;text-align:center;padding:2px}.mini small{font-size:9px;color:#bacad1}.mini b{font-size:13px;display:block;color:#ffeea5}.board-wrap{display:flex;align-items:center;justify-content:center}.board{height:min(54dvh,calc(100dvh - 273px),520px);min-height:285px;aspect-ratio:1/2;position:relative;border:3px solid #91a9be;border-radius:7px;background:#152235;overflow:hidden;box-shadow:0 8px 20px #0008}canvas{position:relative;z-index:2;width:100%;height:100%;display:block}.umji{position:absolute;z-index:1;top:13%;left:4%;height:39%;width:92%;object-fit:cover;object-position:center 40%;opacity:.28;border-radius:14px;transition:opacity .15s,filter .2s,transform .2s;pointer-events:none;filter:saturate(.85)}.board.happy .umji{opacity:.62;animation:joy .55s ease-in-out 3;filter:brightness(1.12) saturate(1.25)}.board.super .umji{opacity:.8;animation:joy .35s ease-in-out 5;filter:brightness(1.3) saturate(1.45)}@keyframes joy{50%{transform:scale(1.13) rotate(-2deg)}}.mood{position:absolute;z-index:4;left:5%;right:5%;top:6%;text-align:center;background:#fff3dcf2;color:#793e39;border-radius:30px;font-weight:900;font-size:12px;padding:7px 4px;pointer-events:none;opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s}.board.happy .mood,.board.super .mood{opacity:1;transform:translateY(0)}.burst{position:absolute;z-index:4;top:35%;width:100%;text-align:center;font-size:23px;opacity:0;pointer-events:none}.board.happy .burst,.board.super .burst{animation:float 1.6s ease-out forwards}@keyframes float{20%{opacity:1}100%{transform:translateY(-65px) scale(1.5);opacity:0}}.overlay{position:absolute;z-index:5;inset:0;background:#111d33e9;display:grid;place-items:center;text-align:center;padding:12px}.overlay.hidden{display:none}.modal{background:#33445a;border:1px solid #d6a96f;border-radius:14px;padding:17px 10px;width:100%}.modal h2{font-size:19px}.modal p{font-size:12px;line-height:1.6}.play{background:#ffd28b;border:0;color:#28394b;font-weight:900;border-radius:10px;font-size:16px;padding:11px 19px}.reward{margin:7px 0;text-align:center;font-size:12px;color:#f8dda6;min-height:16px}.controls{display:grid;grid-template-columns:1fr 1fr 1fr 1.2fr 1fr;gap:5px;margin-top:5px}.controls button{touch-action:none;border:none;border-radius:11px;background:#f8d59a;color:#26394a;font-weight:900;font-size:20px;min-height:55px}.controls button:nth-child(4){background:#b4e3e0}.controls button:nth-child(5){background:#e8b1af}.foot{display:flex;align-items:center;justify-content:space-between;margin:7px 0;gap:8px}.foot button{padding:7px 10px;border-radius:8px;border:1px solid #52657c;background:#2f4258;color:#faf0da}.foot span{font-size:11px;color:#c8d1d8}.safety{font-size:10px;color:#8496a8;margin-top:9px}@media(max-height:620px){.board{height:min(50dvh,calc(100dvh - 245px))}.controls button{min-height:47px}.scores b{font-size:15px}}@media(min-width:700px){.board{height:min(68dvh,560px)}}
</style></head><body><main class="game"><div class="top"><div><h1>🐶 엄지의 간식 블록 DX</h1><span>한 줄 지울 때마다 엄지가 기뻐하는 블록 퍼즐</span></div><div class="chip">UMJI 💛</div></div><div class="scores"><div><small>점수</small><b id="score">0</b></div><div><small>최고</small><b id="best">0</b></div><div><small>줄</small><b id="lines">0</b></div><div><small>레벨</small><b id="level">1</b></div></div><div class="meta"><div class="mini"><small>다음</small><b id="next">?</b></div><div class="mini"><small>보관</small><b id="held">-</b></div><div class="mini"><small>간식</small><b id="snacks">0 🍠</b></div><div class="mini"><small>콤보</small><b id="combo">0</b></div></div><div class="board-wrap"><div class="board" id="board"><img id="dog" class="umji" alt="실제 엄지 사진"><div class="mood" id="mood">엄지야, 간식이다! 😋</div><div class="burst" id="burst">💛 🦴 💛</div><canvas id="cv" width="300" height="600"></canvas><div class="overlay" id="overlay"><div class="modal"><h2 id="modalTitle">엄지의 간식 블록 DX 🐾</h2><p id="modalMessage">블록을 맞춰 줄을 지울 때마다<br>엄지가 간식을 받고 신나게 반응해요.<br><br>한 줄 = 간식 1개 · 네 줄 = 대환호!</p><button class="play" id="start">게임 시작 ▶</button></div></div></div></div><div class="reward" id="reward">💗 엄지가 오빠를 기다리고 있어!</div><div class="controls"><button id="left" aria-label="왼쪽">◀</button><button id="right" aria-label="오른쪽">▶</button><button id="rot" aria-label="회전">⟳</button><button id="drop" aria-label="빠르게 내리기">▼</button><button id="hold" aria-label="보관">↔</button></div><div class="foot"><button id="pause">Ⅱ 일시정지</button><span>← → 이동 · ↑ 회전 · Space 즉시 낙하 · C 보관</span><button id="hard">⤓ 즉시</button></div><div class="safety">소시지와 순대 내장은 게임 속 보상이며 실제 급여 권장이 아니야.</div></main><script src="./game.js?v=5"></script></body></html>
