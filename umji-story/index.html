<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>엄지의 따뜻한 산책 모험</title><style>*{box-sizing:border-box}body{margin:0;background:#173743;color:#fff7e7;font-family:system-ui,sans-serif}main{max-width:600px;margin:auto;padding:12px}h1{font-size:23px;margin:7px 0;color:#ffe2a5}p{font-size:12px;color:#d4e6e1}.hud{display:flex;gap:7px;margin:8px 0}.hud div{flex:1;text-align:center;background:#355967;border-radius:9px;padding:8px;font-size:12px}.hud b{display:block;color:#ffdf9e;font-size:19px}#frame{position:relative}canvas{display:block;width:100%;background:#bce3ed;border:3px solid #afcbb9;border-radius:12px;touch-action:none}.overlay{position:absolute;inset:0;background:#152e3eea;display:grid;place-items:center;padding:15px;border-radius:12px}.hidden{display:none}.dialog{max-width:360px;text-align:center;background:#315a64;border:2px solid #eed2a4;border-radius:18px;padding:22px}.dialog h2{color:#ffe2a5}.dialog p{font-size:15px;line-height:1.8;white-space:pre-line;color:#fff}.controls{display:grid;grid-template-columns:1fr 1fr 1.1fr 1.2fr;gap:6px;margin-top:11px}button{touch-action:manipulation;border:0;border-radius:10px;background:#ffdc98;color:#243d43;font-weight:900;padding:15px 4px;font-size:16px}#pause{background:#3f6c77;color:white;padding:10px;margin-top:10px}small{color:#cbded8}</style></head><body><main><h1>🐾 엄지의 따뜻한 산책 모험</h1><p>송도 더 테라스에서 시작한 엄지의 작은 이야기</p><div class="hud"><div>산책길<b id="stage">1 / 3</b></div><div>추억<b id="found">0 / 5</b></div><div>행복 점수<b id="score">0</b></div></div><div id="frame"><canvas id="game" width="480" height="620"></canvas><div id="overlay" class="overlay"><div class="dialog"><h2 id="title">엄지야, 산책 가자! 💛</h2><p id="story">꽃향기를 맡고, 나비를 만나고, 오빠에게 돌아오는 따뜻한 산책길이에요.\n\n좌우로 걷고 점프하며 다섯 개의 추억을 모아 보세요.</p><button id="start">산책 시작 ▶</button></div></div></div><div class="controls"><button id="left">◀</button><button id="right">▶</button><button id="jump">🐾 점프</button><button id="sniff">🌸 킁킁!</button></div><button id="pause">Ⅱ 잠시 쉬기</button><p><small>PC: ← → 이동 · Space 점프 · Z 냄새 맡기. 휴대폰은 아래 버튼을 사용하세요. 실제 단지 지도가 아닌 창작 산책길입니다.</small></p></main><script>
"use strict";
const c=document.getElementById("game"),g=c.getContext("2d"),$=s=>document.getElementById(s),W=480,H=620,Y=520,world=1900;
const stages=[["정원 산책길","#c8e8ed","꽃향기 가득한 정원길이에요."],["햇살 산책길","#b9dcef","나비와 햇살을 만나러 가요."],["노을 귀갓길","#f4c2af","이제 오빠가 기다리는 집으로 돌아가요."]];
let hero,items,platforms,stage=0,score=0,found=0,cam=0,playing=false,paused=false,keys={left:false,right:false},last=0,raf=0,msg="",msgTime=0;
function box(x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h)}function circ(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function startStage(){hero={x:45,y:Y-45,vy:0,on:true,dir:1,step:0};cam=0;found=0;items=Array.from({length:5},(_,i)=>({x:220+i*300,y:Y-28-(i%2)*93,icon:["🌸","🦋","🍁","💗","🌼"][i],done:false}));platforms=Array.from({length:4},(_,i)=>({x:420+i*315,y:Y-100,w:135}));playing=true;paused=false;last=performance.now();msg=stages[stage][2];msgTime=3;$("overlay").classList.add("hidden");$("pause").textContent="Ⅱ 잠시 쉬기";hud();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}
function hud(){$("stage").textContent=(stage+1)+" / 3";$("found").textContent=found+" / 5";$("score").textContent=score}
function modal(title,text,button){playing=false;cancelAnimationFrame(raf);$("title").textContent=title;$("story").textContent=text;$("start").textContent=button;$("overlay").classList.remove("hidden")}
function jump(){if(playing&&!paused&&hero.on){hero.vy=-480;hero.on=false}}
function sniff(){if(!playing||paused)return;let ok=false;for(let it of items){if(!it.done&&Math.abs(it.x-hero.x-22)<90&&Math.abs(it.y-hero.y-20)<120){it.done=true;found++;score+=100;ok=true;hud()}}msg=ok?"엄지가 좋은 추억을 찾았어요! 💛":"킁킁! 산책길 냄새가 좋아요.";msgTime=1.5}
function tick(t){if(!playing||paused)return;const dt=Math.min(.04,(t-last)/1000);last=t;msgTime-=dt;let dx=(Number(keys.right)-Number(keys.left))*205;hero.x=Math.max(0,Math.min(world-48,hero.x+dx*dt));if(dx){hero.dir=dx>0?1:-1;hero.step+=dt*11}let bottom=hero.y+45;hero.vy+=1120*dt;hero.y+=hero.vy*dt;hero.on=false;if(hero.y+45>=Y){hero.y=Y-45;hero.vy=0;hero.on=true}for(let p of platforms){if(hero.vy>=0&&hero.x+45>p.x&&hero.x<p.x+p.w&&bottom<=p.y+7&&hero.y+45>=p.y){hero.y=p.y-45;hero.vy=0;hero.on=true}}
cam=Math.max(0,Math.min(world-W,hero.x-115));if(hero.x>world-110){if(found<5){hero.x=world-140;msg="추억 "+(5-found)+"개를 더 찾아보자!";msgTime=1.7}else if(stage<2){stage++;modal("멋진 산책이었어! 🐾","엄지가 좋은 추억을 다 모았어요.\n다음 산책길로 갈까요?","다음 산책 ▶")}else{modal("엄지야, 잘 다녀왔어! 💛","엄지가 오빠에게 돌아왔어요.\n꽃향기와 햇살, 그리고 함께 걷는 시간이 가장 좋은 선물이었어요.\n\n행복 점수 "+score+"점","처음부터 다시 ▶")}}draw();if(playing)raf=requestAnimationFrame(tick)}
const umjiSprite=new Image();umjiSprite.src="./umji-character.svg";umjiSprite.onload=()=>{if(!playing)draw()};
function dog(x,y){
  if(umjiSprite.complete&&umjiSprite.naturalWidth){
    g.save();g.translate(x,y);g.scale(hero.dir,1);
    let bounce=(keys.left||keys.right)?Math.sin(hero.step)*2:0;
    g.drawImage(umjiSprite,-44,-62+bounce,92,65);g.restore();
  } else {
    g.save();g.translate(x,y);g.scale(hero.dir,1);g.fillStyle="#b58a64";g.beginPath();g.ellipse(-7,-17,27,19,0,0,7);g.fill();g.fillStyle="#f7e9d5";g.beginPath();g.ellipse(25,-24,24,21,0,0,7);g.fill();g.restore();
  }
}
function draw(){box(0,0,W,H,stages[stage][1]);circ(398,90,36,"#fff1c8");for(let i=0;i<16;i++){let bx=i*138-cam*.34;box(bx,160+i%3*17,90,240,"#d3d9d7");for(let j=0;j<4;j++)for(let k=0;k<3;k++)box(bx+10+k*25,180+j*43+i%3*17,14,24,"#91b7c0")}
box(0,405,W,115,"#a4d4ae");for(let i=0;i<23;i++){let bx=i*100-cam*.7;box(bx,400,7,67,"#99765b");circ(bx+4,398,24,"#5da275")}box(0,Y,W,H-Y,"#d5c5a9");box(0,Y,W,9,"#9bc7a6");
for(let p of platforms){let x=p.x-cam;box(x,p.y,p.w,15,"#a97a59");box(x,p.y,p.w,5,"#83b68d")}
for(let it of items)if(!it.done){let x=it.x-cam;g.font="30px serif";g.fillText(it.icon,x-16,it.y+10)}
g.font="33px serif";g.fillText("🏡",world-85-cam,Y-8);
dog(hero.x-cam+25,hero.y+39);
box(0,0,W,30,"#396976");g.font="bold 14px sans-serif";g.fillStyle="#fff4cc";g.fillText(stages[stage][0],13,20);
if(msgTime>0){g.fillStyle="#264e5edc";g.beginPath();g.roundRect(25,51,430,43,15);g.fill();g.font="bold 15px sans-serif";g.fillStyle="white";g.textAlign="center";g.fillText(msg,240,77);g.textAlign="left"}}
function bind(id,k){let b=$(id);b.addEventListener("pointerdown",e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true});["pointerup","pointercancel","lostpointercapture"].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))}
bind("left","left");bind("right","right");$("jump").onclick=jump;$("sniff").onclick=sniff;
document.addEventListener("keydown",e=>{if(["ArrowLeft","ArrowRight","ArrowUp","Space","KeyZ"].includes(e.code))e.preventDefault();if(e.code==="ArrowLeft")keys.left=true;if(e.code==="ArrowRight")keys.right=true;if(e.code==="Space"||e.code==="ArrowUp")jump();if(e.code==="KeyZ")sniff()});
document.addEventListener("keyup",e=>{if(e.code==="ArrowLeft")keys.left=false;if(e.code==="ArrowRight")keys.right=false});
$("start").onclick=()=>{if(!playing){if(stage>=3)stage=0;if($("title").textContent.includes("잘 다녀왔어")){stage=0;score=0}startStage()}};
$("pause").onclick=()=>{if(!playing)return;paused=!paused;$("pause").textContent=paused?"▶ 계속 산책":"Ⅱ 잠시 쉬기";if(!paused){last=performance.now();raf=requestAnimationFrame(tick)}else cancelAnimationFrame(raf)};
stage=0;hero={x:45,y:Y-45,dir:1,step:0};items=[];platforms=[];draw();
</script></body></html>
