<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#14354b"><title>엄지의 송도 산책 대모험</title><style>
*{box-sizing:border-box}body{margin:0;background:#112738;color:#f5f8fc;font-family:system-ui,-apple-system,sans-serif}main{max-width:620px;margin:auto;padding:12px}h1{font-size:23px;margin:5px 0;color:#ffe4a5}p{color:#bed0d8;font-size:13px;margin:4px 0 12px}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}.hud div{background:#21445b;border-radius:10px;text-align:center;padding:8px 3px;font-size:11px}.hud b{display:block;font-size:17px;color:#ffdb82}#wrap{position:relative}canvas{display:block;width:100%;background:#81c6df;border:3px solid #496d7a;border-radius:14px;touch-action:none}.overlay{position:absolute;inset:0;background:#102d40de;display:grid;place-items:center;border-radius:13px;padding:18px}.overlay.hidden{display:none}.modal{max-width:350px;background:#224a5d;border:2px solid #f0c78b;border-radius:17px;padding:23px;text-align:center}.modal h2{color:#ffe1a0;font-size:24px;margin:0 0 12px}.modal p{color:white;line-height:1.7}.btn{border:0;border-radius:12px;background:#ffd37e;color:#18303c;padding:14px;font-weight:900;font-size:18px;touch-action:manipulation}.controls{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:9px;margin:10px 0}.controls button{font-size:20px;min-height:64px}#pause{font-size:13px;background:#29526a;color:white;padding:10px 16px;border:1px solid #64869a;border-radius:9px}footer{text-align:center;color:#a4bdc9;font-size:11px;line-height:1.6}.chip{display:inline-block;background:#29526a;border-radius:30px;padding:5px 11px;font-size:11px;color:#ecf7fb}a{color:#ffe1a0}</style></head><body><main><span class="chip">🐶 엄지의 첫 번째 어드벤처</span><h1>엄지의 송도 산책 대모험</h1><p>송도 더 테라스에서 시작하는 꼬마 탐험가의 신나는 산책!</p><div class="hud"><div>💛 체력<b id="hp">♥♥♥</b></div><div>🦴 간식<b id="bones">0/7</b></div><div>🏡 스테이지<b id="stage">1/3</b></div><div>🏆 최고점<b id="best">0</b></div></div><div id="wrap"><canvas id="game" width="480" height="660" aria-label="엄지가 아파트 단지 산책로를 걸으며 간식을 수집하는 게임"></canvas><div id="overlay" class="overlay"><div class="modal"><h2 id="title">엄지야, 산책 가자! 🐾</h2><p id="description">엄지를 좌우로 움직이고 점프해서<br>🦴 간식 7개를 모은 뒤 오른쪽 끝의 🚩 깃발에 도착하세요.<br>🚲 자전거·💦 물웅덩이는 피해요!<br><br>엄지 오빠가 기다리고 있어!</p><button id="start" class="btn">산책 시작 ▶</button></div></div></div><div class="controls"><button class="btn" id="left" aria-label="왼쪽 이동">◀</button><button class="btn" id="right" aria-label="오른쪽 이동">▶</button><button class="btn" id="jump" aria-label="점프">🐾 점프</button></div><button id="pause">Ⅱ 잠시 쉬기</button><footer>손가락 버튼 또는 PC 방향키·스페이스바로 조작해요.<br>엄지의 모습은 사진에서 영감을 받은 2D 일러스트이며, 산책로는 창작 게임 맵입니다.</footer></main><script>
"use strict";
const c=document.getElementById("game"),ctx=c.getContext("2d"),$=id=>document.getElementById(id),W=480,H=660,G=566;
let hero,world,platforms,objects,stage=1,hearts=3,score=0,bones=0,need=7,best=0,playing=false,paused=false,keys={left:false,right:false},last=0,raf=0,cam=0,msg="",msgTime=0,inv=0;
try{best=Number(localStorage.getItem("umji-walk-best")||0)||0}catch(e){}
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function roundRect(x,y,w,h,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function startGame(){stage=1;hearts=3;score=0;beginStage()}
function beginStage(){world=1750+stage*310;cam=0;bones=0;objects=[];platforms=[];hero={x:60,y:G-44,vx:0,vy:0,w:50,h:44,on:true,face:1,walk:0};for(let x=180;x<world-150;x+=180){objects.push({type:"bone",x:x+rand(-22,20),y:G-25-(Math.random()>.65?90:0),taken:false})}
for(let i=0;i<stage+3;i++){let x=370+i*330+rand(-45,45);objects.push({type:i%2?"bike":"puddle",x,y:G-17,hit:false})}
for(let i=0;i<5;i++)platforms.push({x:260+i*320,y:G-100,w:120,h:16});
need=7;playing=true;paused=false;inv=0;msg="🦴 간식 7개를 모으자!";msgTime=2.5;last=performance.now();$("overlay").classList.add("hidden");updateHUD();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function updateHUD(){$("hp").textContent="♥".repeat(Math.max(0,hearts));$("bones").textContent=bones+"/"+need;$("stage").textContent=stage+"/3";$("best").textContent=best.toLocaleString()}
function end(title,description){playing=false;cancelAnimationFrame(raf);$("title").textContent=title;$("description").textContent=description;$("start").textContent="처음부터 다시 ▶";$("overlay").classList.remove("hidden")}
function damage(){if(inv>0)return;hearts--;inv=1.4;hero.vy=-310;hero.vx=-hero.face*170;msg="앗! 조심해, 엄지!";msgTime=1.6;if(hearts<=0){saveBest();end("잠깐 쉬어 가자 🐾","이번 산책 점수 "+score.toLocaleString()+"점! 엄지는 충분히 잘했어. 오빠랑 다시 산책하자.")}updateHUD()}
function saveBest(){if(score>best){best=score;try{localStorage.setItem("umji-walk-best",String(best))}catch(e){}}}
function jump(){if(playing&&!paused&&hero.on){hero.vy=-480;hero.on=false}}
function overlap(a,b,r){return Math.abs(a.x-b.x)<r}
function loop(t){if(!playing||paused)return;let dt=Math.min((t-last)/1000,.035);last=t;inv=Math.max(0,inv-dt);msgTime-=dt;
hero.vx=0;if(keys.left){hero.vx=-235;hero.face=-1}if(keys.right){hero.vx=235;hero.face=1}hero.x=clamp(hero.x+hero.vx*dt,0,world-50);
const previousBottom=hero.y+hero.h;hero.vy+=1030*dt;hero.y+=hero.vy*dt;hero.on=false;
if(hero.y+hero.h>=G){hero.y=G-hero.h;hero.vy=0;hero.on=true}
for(let p of platforms){if(hero.vy>=0&&hero.x+hero.w>p.x&&hero.x<p.x+p.w&&previousBottom<=p.y+8&&hero.y+hero.h>=p.y){hero.y=p.y-hero.h;hero.vy=0;hero.on=true}}
hero.walk+=Math.abs(hero.vx)*dt/25;cam=clamp(hero.x-125,0,world-W);
for(const o of objects){if(o.type==="bone"&&!o.taken&&Math.abs(hero.x+25-o.x)<35&&Math.abs(hero.y+20-o.y)<43){o.taken=true;bones++;score+=100;msg="맛있는 간식 발견! 🦴";msgTime=.8;updateHUD()}
if(o.type!=="bone"&&Math.abs(hero.x+25-o.x)<30&&hero.y+hero.h>G-41)damage()}
if(hero.x>world-110){if(bones>=need){score+=hearts*150+500;saveBest();if(stage===3){updateHUD();end("엄지의 산책 대성공! 🎉","간식도 모으고 세 곳의 산책길도 모두 탐험했어! 최종 점수 "+score.toLocaleString()+"점. 엄지 오빠가 최고라고 칭찬해!") }else{stage++;beginStage();msg="새로운 산책길에 도착!";msgTime=2}}else{msg="깃발로 가기 전에 간식 "+(need-bones)+"개 더!";msgTime=.6;hero.x=world-125}}
if(playing){draw();raf=requestAnimationFrame(loop)}}
function dog(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s*hero.face,s);
const step=Math.sin(hero.walk*2)*3;roundRect(-24,-30,49,31,15,"#b8875a");roundRect(-19,-7,10,19,5,"#e7c5a2");roundRect(10,-7+step,10,19,5,"#e7c5a2");
ctx.strokeStyle="#a9784d";ctx.lineWidth=7;ctx.beginPath();ctx.arc(-24,-29,14,Math.PI*1.03,Math.PI*1.8);ctx.stroke();
roundRect(4,-39,32,34,15,"#d7b18b");ctx.fillStyle="#fff3db";ctx.beginPath();ctx.ellipse(28,-18,19,13,-.1,0,7);ctx.fill();
ctx.fillStyle="#99704d";ctx.beginPath();ctx.ellipse(1,-22,8,18,-.35,0,7);ctx.fill();
ctx.fillStyle="#8c603f";ctx.beginPath();ctx.ellipse(18,-43,7,12,-.3,0,7);ctx.fill();
ctx.fillStyle="#87d6ce";ctx.fillRect(17,-54,4,8);
ctx.fillStyle="#191c25";ctx.beginPath();ctx.arc(25,-31,4.3,0,7);ctx.fill();ctx.fillStyle="white";ctx.beginPath();ctx.arc(26.2,-32.5,1.3,0,7);ctx.fill();
ctx.fillStyle="#2b2629";ctx.beginPath();ctx.arc(42,-18,4,0,7);ctx.fill();ctx.strokeStyle="#8e4b55";ctx.lineWidth=2;ctx.beginPath();ctx.arc(36,-13,5,0,Math.PI);ctx.stroke();ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);
let skies=["#b2e5f0","#a4d6ee","#ffcead"];ctx.fillStyle=skies[stage-1];ctx.fillRect(0,0,W,H);
ctx.fillStyle="#fff5cf";ctx.beginPath();ctx.arc(405,95,38,0,7);ctx.fill();
for(let i=0;i<14;i++){let bx=i*165-cam*.32;ctx.fillStyle=i%2?"#afc5ce":"#d0dce0";ctx.fillRect(bx,172+(i%3)*22,112,292);ctx.fillStyle="#7b9eae";for(let r=0;r<5;r++)for(let col=0;col<3;col++)ctx.fillRect(bx+10+col*30,190+(i%3)*22+r*44,18,27)}
ctx.fillStyle="#5d9f77";ctx.fillRect(0,448,W,118);
for(let i=0;i<25;i++){let tx=i*107-cam*.65;ctx.fillStyle="#765b3d";ctx.fillRect(tx,433,7,60);ctx.fillStyle="#4f9368";ctx.beginPath();ctx.arc(tx+4,427,23,0,7);ctx.fill()}
ctx.fillStyle="#d7c8aa";ctx.fillRect(0,G,W,H-G);ctx.fillStyle="#a6b4a1";ctx.fillRect(0,G, W,7);
for(let i=0;i<world/70;i++){let px=i*70-cam;ctx.fillStyle="#c0b199";ctx.fillRect(px,G+48,36,2)}
for(const p of platforms){let px=p.x-cam;roundRect(px,p.y,p.w,p.h,6,"#a77e5d");roundRect(px,p.y,p.w,5,3,"#8eb983")}
for(const o of objects){let px=o.x-cam;if(px<-60||px>W+60)continue;if(o.type==="bone"&&!o.taken){ctx.font="27px serif";ctx.fillText("🦴",px-13,o.y+9)}if(o.type==="bike"){ctx.font="32px serif";ctx.fillText("🚲",px-18,o.y+11)}if(o.type==="puddle"){ctx.fillStyle="#69b9d6";ctx.beginPath();ctx.ellipse(px,G-4,27,8,0,0,7);ctx.fill()}}
let fx=world-75-cam;ctx.font="34px serif";ctx.fillText("🚩",fx,G-30);ctx.font="14px sans-serif";ctx.fillStyle="#38576c";ctx.fillText("산책 도착!",fx-10,G-53);
if(inv===0||Math.floor(inv*15)%2===0)dog(hero.x-cam+21,hero.y+41,.93);
if(msgTime>0){roundRect(55,45,370,42,18,"#183b50d9");ctx.fillStyle="white";ctx.textAlign="center";ctx.font="bold 17px sans-serif";ctx.fillText(msg,240,72);ctx.textAlign="left"}
ctx.fillStyle="#254d5de0";ctx.fillRect(0,0,W,28);ctx.fillStyle="#fff1c4";ctx.font="bold 13px sans-serif";ctx.fillText(["송도 더 테라스 · 정원길","분수와 산책로","노을 테라스 길"][stage-1],14,19)}
const bind=(id,key)=>{const b=$(id);b.addEventListener("pointerdown",e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[key]=true});for(const v of ["pointerup","pointercancel","lostpointercapture"])b.addEventListener(v,()=>keys[key]=false)};
bind("left","left");bind("right","right");$("jump").addEventListener("pointerdown",e=>{e.preventDefault();jump()});
document.addEventListener("keydown",e=>{if(["ArrowLeft","ArrowRight","ArrowUp","Space"].includes(e.code))e.preventDefault();if(e.code==="ArrowLeft")keys.left=true;if(e.code==="ArrowRight")keys.right=true;if(e.code==="Space"||e.code==="ArrowUp")jump()});
document.addEventListener("keyup",e=>{if(e.code==="ArrowLeft")keys.left=false;if(e.code==="ArrowRight")keys.right=false});
$("start").onclick=startGame;$("pause").onclick=()=>{if(!playing)return;paused=!paused;$("pause").textContent=paused?"▶ 다시 산책":"Ⅱ 잠시 쉬기";if(!paused){last=performance.now();raf=requestAnimationFrame(loop)}else cancelAnimationFrame(raf)};
world=2150;platforms=[];objects=[];hero={x:60,y:G-44,vx:0,vy:0,w:50,h:44,on:true,face:1,walk:0};$("best").textContent=best.toLocaleString();draw();
</script></body></html>
