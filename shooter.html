<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1,maximum-scale=1,user-scalable=no"><title>낭만선술: 버거 디펜스</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1221;color:#fff;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100dvh}#app{width:min(100vw,480px);position:relative;background:#101a30;overflow:hidden}header{padding:10px 14px;background:#192741;display:flex;justify-content:space-between;align-items:center;font-size:13px}header b{color:#ffd16b}canvas{width:100%;display:block;touch-action:none;background:#101a30}#hint{text-align:center;font-size:12px;color:#b7c6d8;padding:8px}.overlay{position:absolute;inset:45px 0 0;background:#081020d9;display:grid;place-items:center;padding:20px;z-index:2}.modal{text-align:center;background:#20314c;border:2px solid #e9aa54;border-radius:20px;padding:24px 18px;max-width:355px;width:100%}.modal h1{font-size:28px;margin:6px 0;color:#ffd170}.modal p{font-size:14px;line-height:1.7;color:#e0e9fa}button{background:#ffc467;color:#1a2130;font-weight:900;font-size:17px;padding:13px 22px;border:0;border-radius:12px;cursor:pointer}#hp{color:#ff7f8c}#special{position:absolute;right:12px;bottom:47px;padding:12px;font-size:13px;background:#8ce9e1;color:#132735;box-shadow:0 2px 12px #0009}#special:disabled{opacity:.4}a{color:#ffd16b}#back{font-size:11px;color:#b7c6d8;text-decoration:none}
</style></head><body><div id="app"><header><div><b>🍔 낭만선술 DEFENSE</b> <span id="wave">1단계</span></div><div><span id="hp">♥♥♥</span>　<span id="score">0</span>점</div></header><canvas id="game" width="400" height="640"></canvas><button id="special" disabled>💥 버거 폭탄 0%</button><div id="hint">👆 화면을 누르고 움직이면 이동 · 자동 발사 · 적을 피하세요</div><div class="overlay" id="overlay"><div class="modal"><h1 id="title">🍔 버거 디펜스!</h1><p id="info">낭만선술의 버거스테이지를 지켜라!<br>밀려오는 야식 몬스터들을 버거 탄환으로 물리치세요.<br>손가락으로 이동하면 자동 발사!<br>💥 에너지가 차면 버거 폭탄을 쓸 수 있어요.</p><button id="start">게임 시작 ▶</button><p style="font-size:12px">PC에서는 마우스 이동도 가능해요.</p><a id="back" href="./">← 기존 가게 운영 게임</a></div></div></div><script>
"use strict";
const c=document.getElementById("game"),x=c.getContext("2d"),$=id=>document.getElementById(id);
const W=400,H=640;let player,shots,enemies,particles,pickups,boss,score,hp,energy,wave,clock,spawn,shotT,inv,live,last,raf,elapsed,bossSpawned,stars;
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function reset(){player={x:W/2,y:H-76,r:19};shots=[];enemies=[];particles=[];pickups=[];boss=null;score=0;hp=3;energy=0;wave=1;clock=0;spawn=.5;shotT=0;inv=0;elapsed=0;bossSpawned=false;stars=Array.from({length:60},()=>({x:rnd(0,W),y:rnd(0,H),z:rnd(.5,2)}));live=true;last=performance.now();updateHUD();raf=requestAnimationFrame(loop)}
function updateHUD(){$("wave").textContent=wave+"단계"+(boss?" 👑보스":"");$("hp").textContent="♥".repeat(hp)+"♡".repeat(3-hp);$("score").textContent=score.toLocaleString("ko-KR");$("special").textContent="💥 버거 폭탄 "+Math.floor(energy)+"%";$("special").disabled=!live||energy<100}
function burst(px,py,color,count=10){for(let i=0;i<count;i++){let a=rnd(0,Math.PI*2),s=rnd(40,160);particles.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:rnd(.2,.6),color})}}
function hit(){if(inv>0)return;hp--;inv=1.4;burst(player.x,player.y,"#ff6682",17);if(hp<=0)finish();updateHUD()}
function spawnEnemy(){const types=[{icon:"🍟",hp:1,v:85,points:100},{icon:"🍗",hp:2,v:60,points:180},{icon:"🌶️",hp:1,v:135,points:130}];let t=types[Math.floor(rnd(0,types.length))];enemies.push({x:rnd(28,W-28),y:-35,r:19,hp:t.hp,v:t.v+wave*9,icon:t.icon,points:t.points,wob:rnd(0,6.28),shoot:0})}
function createBoss(){boss={x:W/2,y:-60,hp:25+wave*6,max:25+wave*6,r:46,phase:0,fire:1.2};}
function shoot(){shots.push({x:player.x,y:player.y-20,vy:-420,r:8})}
function bomb(){if(!live||energy<100)return;energy=0;for(const e of enemies){score+=e.points;burst(e.x,e.y,"#ffce68",12)}enemies=[];if(boss){boss.hp-=12;burst(boss.x,boss.y,"#ffce68",20);if(boss.hp<=0)killBoss()}updateHUD()}
function killBoss(){if(!boss)return;score+=2000;burst(boss.x,boss.y,"#ffbf51",45);boss=null;wave++;bossSpawned=false;elapsed=0;spawn=1;energy=clamp(energy+30,0,100);updateHUD()}
function finish(){live=false;cancelAnimationFrame(raf);$("title").textContent="영업 방어 종료!";$("info").innerHTML="획득 점수 <strong>"+score.toLocaleString("ko-KR")+"</strong>점<br>도달 단계 "+wave+"<br>"+(score>=4000?"오늘 밤 최고의 버거 히어로! 🏆":"다시 도전하면 더 높은 점수를 얻을 수 있어요!");$("start").textContent="다시 도전 ↻";$("overlay").style.display="grid"}
function circle(a,b,r){return Math.hypot(a.x-b.x,a.y-b.y)<r}
function loop(now){if(!live)return;let dt=Math.min((now-last)/1000,.04);last=now;clock+=dt;elapsed+=dt;shotT-=dt;spawn-=dt;inv=Math.max(0,inv-dt);
if(shotT<=0){shoot();shotT=.20}
if(spawn<=0&&!boss){spawnEnemy();spawn=Math.max(.35,1.0-wave*.06)*rnd(.7,1.2)}
if(elapsed>24&&!boss&&!bossSpawned){createBoss();bossSpawned=true;enemies=[]}
for(let s of stars){s.y+=s.z*22*dt;if(s.y>H)s.y=0}
for(let s of shots)s.y+=s.vy*dt;
for(let e of enemies){e.y+=e.v*dt;e.x+=Math.sin(clock*3+e.wob)*20*dt;if(circle(e,player,e.r+player.r-4)) {e.hp=0;hit()}if(e.y>H+30){e.hp=0;hit()}}
if(boss){boss.phase+=dt;boss.y=Math.min(94,boss.y+60*dt);boss.x=W/2+Math.sin(boss.phase*1.2)*110; if(circle(boss,player,60))hit();}
for(let s of shots){for(let e of enemies){if(e.hp>0&&circle(s,e,e.r+s.r)){e.hp--;s.y=-999;if(e.hp<=0){score+=e.points;energy=clamp(energy+8,0,100);burst(e.x,e.y,"#ffc965",9);if(Math.random()<.06)pickups.push({x:e.x,y:e.y,icon:"💚"})}break}}
if(boss&&s.y>-100&&circle(s,boss,43)){s.y=-999;boss.hp--;energy=clamp(energy+2,0,100);if(boss.hp<=0)killBoss()}}
for(let p of pickups){p.y+=80*dt;if(circle(p,player,28)){hp=Math.min(3,hp+1);p.y=H+100;burst(player.x,player.y,"#76f4ac",12)}}
for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt}
shots=shots.filter(s=>s.y>-30);enemies=enemies.filter(e=>e.hp>0&&e.y<H+30);particles=particles.filter(p=>p.t>0);pickups=pickups.filter(p=>p.y<H+30);
draw();updateHUD();if(live)raf=requestAnimationFrame(loop)}
function draw(){x.fillStyle="#101a30";x.fillRect(0,0,W,H);for(let s of stars){x.fillStyle="#ffffff66";x.fillRect(s.x,s.y,s.z*1.5,s.z*1.5)}
x.fillStyle="#192d3c";for(let i=0;i<6;i++){let y=(i*145+clock*38)%750-60;x.fillRect(0,y,W,3)}
x.fillStyle="#e0a654";x.fillRect(7,10,80,25);x.font="bold 13px sans-serif";x.fillStyle="#2c2134";x.fillText("낭만선술",15,28);
for(let s of shots){x.font="19px sans-serif";x.fillText("🍔",s.x-11,s.y+8)}
for(let e of enemies){x.font="35px sans-serif";x.fillText(e.icon,e.x-19,e.y+12)}
for(let p of pickups){x.font="27px sans-serif";x.fillText(p.icon,p.x-12,p.y)}
if(boss){x.font="72px sans-serif";x.fillText("👾",boss.x-40,boss.y+22);x.fillStyle="#444";x.fillRect(68,12,264,10);x.fillStyle="#ff7d70";x.fillRect(68,12,264*Math.max(0,boss.hp/boss.max),10);x.font="bold 13px sans-serif";x.fillStyle="white";x.fillText("👑 심야 보스",149,42)}
for(let p of particles){x.globalAlpha=clamp(p.t*2,0,1);x.fillStyle=p.color;x.fillRect(p.x,p.y,5,5)}x.globalAlpha=1;
if(inv===0||Math.floor(clock*12)%2===0){x.font="39px sans-serif";x.fillText("👨‍🍳",player.x-22,player.y+14);x.font="19px sans-serif";x.fillText("🛡️",player.x+13,player.y-11)}
}
function move(ev){if(!live)return;const rect=c.getBoundingClientRect();player.x=clamp((ev.clientX-rect.left)/rect.width*W,22,W-22);player.y=clamp((ev.clientY-rect.top)/rect.height*H,70,H-25)}
c.addEventListener("pointerdown",e=>{c.setPointerCapture(e.pointerId);move(e)});c.addEventListener("pointermove",e=>{if(e.buttons||e.pointerType==="touch")move(e)});
$("special").addEventListener("click",bomb);$("start").onclick=()=>{$("overlay").style.display="none";reset()};
stars=Array.from({length:60},()=>({x:rnd(0,W),y:rnd(0,H),z:rnd(.5,2)}));player={x:W/2,y:H-76};shots=[];enemies=[];particles=[];pickups=[];boss=null;clock=0;inv=0;draw();
</script></body></html>
